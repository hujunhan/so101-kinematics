[project]
name = "so101-kinematics"
version = "0.1.0"
description = "SO-101 kinematics: my 2023 arm_control vs Pinocchio, joint-limited IK with an approach angle, drawing on the real arm"
readme = "README.md"
license = "MIT"
authors = [{ name = "Junhan Hu" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pin>=3.0",          # Pinocchio (reference kinematics)
    "matplotlib>=3.8",
    "so101-core @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7",
    "arm-control @ git+https://github.com/hujunhan/arm_control@65f2cea30984ae5b4185850b0dfe67dd915e067e",
]

[project.scripts]
so101-draw = "so101_kinematics.s3:main"

[project.optional-dependencies]
hw = ["so101-core[hw] @ git+https://github.com/hujunhan/so101-core@534b1e91f488768ea92d1f92bbf6cc3459d00bb7"]

[dependency-groups]
dev = [
    "pin-pink>=4.4.0",
    "pytest>=8",
    "quadprog>=0.1.14",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_kinematics"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501"]  # report tables
